<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control Lab — Handy-Version</title>
<style>
  :root {
    --paper: #bfc1c3;
    --paper-deep: #aeb1b3;
    --ink: #353a3c;
    --muted: #777b79;
    --steel: #9fa5a5;
    --steel-light: #dfe2df;
    --steel-dark: #676e70;
    --teal: #52e5d0;
    --cyan: #8ef7ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #bfc1c3;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  .workbench {
    width: min(1600px, 100%);
    min-height: 830px;
    height: 100vh;
    min-height: max(830px, 100vh);
    margin: 0 auto;
    padding: clamp(16px, 2.1vw, 32px);
    display: grid;
    grid-template-columns: clamp(320px, 22vw, 360px) minmax(500px, 1fr) clamp(125px, 9vw, 150px);
    grid-template-rows: 315px minmax(450px, 1fr);
    gap: 24px clamp(16px, 2vw, 30px);
    position: relative;
    isolation: isolate;
  }
  .workbench::before {
    content: ""; position: absolute; inset: 14px; border: 1px solid rgba(94,99,98,.19);
    border-radius: 22px; pointer-events: none; z-index: -1;
  }
  .machine-label {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    text-transform: uppercase; letter-spacing: .22em; font-size: 11px; font-weight: 750; color: #505456;
    white-space: nowrap; opacity: .9;
  }

  /* LEFT: numbered safe dial and momentary keys */
  .left-bank { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 8px; }
  .dial-heading, .keys-heading, .screen-heading, .lever-heading {
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #767c79; font-weight: 750;
  }
  .dial-area { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .safe-dial {
    width: clamp(270px, 19vw, 315px); aspect-ratio: 1; position: relative; border-radius: 50%; cursor: crosshair; touch-action: none;
    background: #101214; border: 8px solid #3e4447;
    box-shadow: 0 0 0 2px #d8dadd, 0 0 0 6px #70777a, inset 0 0 0 2px #343a3d, inset 0 0 0 10px #202528;
    user-select:none;
  }
  .dial-face {
    position:absolute; inset:10px; border-radius:50%; border: 1px solid #737d80;
    background: radial-gradient(circle at 44% 32%, #32393b 0%, #1e2426 58%, #101416 100%);
    overflow:hidden;
  }
  .dial-face::before { content:""; position:absolute; inset:8px; border:1px solid rgba(220,228,230,.24); border-radius:50%; }
  .dial-numbers { position:absolute; inset:0; transform:rotate(0deg); border-radius:50%; }
  /* A metallic ribbon winds inward around the dial, starting fine and thickening as it coils. */
  .dial-ribbon-svg {
    position:absolute; inset:0; width:100%; height:100%; overflow:visible;
    pointer-events:none; z-index:0; opacity:.88;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.38));
  }
  .dial-number {
    position:absolute; left:50%; top:50%; width:24px; height:14px; margin-left:-12px; margin-top:-7px;
    display:flex; justify-content:center; align-items:center; font-size:8px; font-weight:850; color:#f6f8f7;
    transform-origin:50% 50%; font-variant-numeric:tabular-nums; z-index:1;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .dial-number.major { color:#ffffff; font-size:7px; }
  .dial-center {
    position:absolute; width:26%; aspect-ratio:1; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%;
    border: 3px solid #777f82; background: #090c0e; box-shadow: inset 0 0 0 3px #454c4f, 0 1px 2px #050607;
    display:grid; place-items:center; z-index:3;
  }
  .dial-center::before { content:""; width:7px; height:7px; border-radius:50%; background:#f4f7f6; box-shadow:0 0 0 3px #6e777b; }
  .dial-pointer { position:absolute; z-index:4; left:50%; top:8%; width:3px; height:14%; background:#ffffff; transform:translateX(-50%); border-radius:4px; box-shadow:0 0 0 1px rgba(0,0,0,.45); }
  .dial-status { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; color:#737977; letter-spacing:.1em; min-height:14px; }
  .dial-status b { color:#2d9289; font-weight:800; }
  .dial-instructions { text-align:center; max-width:205px; margin-top:-4px; color:#8a8e89; font-size:10px; line-height:1.45; }
  .safe-dial.is-active { box-shadow: 0 0 0 2px #d8dadd, 0 0 0 5px #777d80, 0 0 18px rgba(68,202,185,.38), inset 0 0 0 2px #343a3d, inset 0 0 0 8px #202528; }
  .safe-dial.is-active .dial-status { color:#238e85; }
   .keys-area { display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }
  .color-keys { display:grid; grid-template-columns: repeat(2, minmax(125px, 145px)); gap:18px 18px; }
  .key {
    --key-color:#e53935; height:125px; width:100%; border:0; border-radius:17px; cursor:pointer; touch-action: manipulation;
    position:relative; outline:none; background:transparent; padding:0; color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  .key-cap {
    position:absolute; inset:0; border-radius:16px; border:2px solid rgba(75,79,77,.62);
    background:var(--key-color); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -5px 0 rgba(0,0,0,.11), 0 5px 0 #b4b6b1, 0 7px 5px rgba(44,47,45,.12);
    transition: transform 100ms ease, filter 100ms ease, box-shadow 100ms ease;
  }
  .key-cap::after { content:""; position:absolute; inset:8px; border-radius:10px; border:1px solid rgba(255,255,255,.4); }
  .key:active .key-cap, .key.is-pressed .key-cap {
    transform:translateY(4px); filter:brightness(1.17); box-shadow:inset 0 2px 0 rgba(255,255,255,.68), inset 0 -2px 0 rgba(0,0,0,.1), 0 1px 0 #b4b6b1, 0 2px 3px rgba(44,47,45,.12);
  }
  .key:focus-visible .key-cap { outline: 3px solid #298c89; outline-offset: 4px; }
  .key-label { position:absolute; left:0; right:0; bottom:-17px; text-align:center; font-size:8px; letter-spacing:.12em; text-transform:uppercase; color:#737873; }

  /* TOP CENTER: animated lab monitor */
  .monitor-zone { grid-column:2; grid-row:1; display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; padding-top:2px; }
  .monitor { width:min(940px, 100%); height:clamp(265px, 32vh, 290px); border:5px solid #969e9d; border-radius:12px; padding:5px; background:#b9bfbb; box-shadow:0 0 0 1px #f3f3ef, 0 4px 0 #7f8785, 0 8px 14px rgba(52,58,56,.11); position:relative; overflow:hidden; }
  .monitor::before { content:""; position:absolute; inset:0; border:1px solid rgba(255,255,255,.7); border-radius:7px; pointer-events:none; z-index:2; }
  .monitor-screen { position:relative; height:100%; overflow:hidden; border-radius:5px; padding:12px 15px; background:#172328; color:#8ff6df; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .screen-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(106,181,171,.1) 1px, transparent 1px),linear-gradient(90deg,rgba(106,181,171,.1) 1px,transparent 1px); background-size:19px 19px; opacity:.9; }
  .scanline { position:absolute; top:-28%; left:0; right:0; height:24%; background:linear-gradient(transparent,rgba(96,240,208,.12),transparent); animation:scan 5s linear infinite; pointer-events:none; }
  @keyframes scan { to { transform:translateY(560%); } }
  .screen-topline { position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:9px; letter-spacing:.12em; z-index:1; }
  .screen-live { color:#6cf6d0; display:flex; align-items:center; gap:5px; }
  .screen-live i { display:inline-block; width:5px; height:5px; border-radius:50%; background:#73f6cf; box-shadow:0 0 9px #73f6cf; animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .screen-content { position:relative; z-index:1; display:grid; grid-template-columns:1.25fr .8fr; gap:13px; height:calc(100% - 24px); padding-top:10px; }
  .monitor-screen { padding:14px 17px; }
  .screen-topline { font-size:10px; }
  .tiny-label { font-size:8px; }
  .chart-panel,.cube-panel,.data-panel { padding:6px 8px; }
  .chart-panel { position:relative; min-width:0; border:1px solid rgba(116,226,205,.22); background:rgba(37,66,67,.25); padding:5px 7px 4px; overflow:hidden; }
  .tiny-label { font-size:7px; color:#79b9b1; letter-spacing:.13em; }
  .chart-svg { display:block; width:100%; height:calc(100% - 12px); overflow:visible; }
  .chart-line { stroke-dasharray:460; stroke-dashoffset:0; animation:chartmove 7s linear infinite; }
  @keyframes chartmove { 0% { stroke-dashoffset:460; } 55%,100% { stroke-dashoffset:0; } }
  .right-readouts { display:grid; grid-template-rows:1fr 1fr; gap:8px; min-width:0; }
  .cube-panel,.data-panel { position:relative; border:1px solid rgba(116,226,205,.22); background:rgba(37,66,67,.25); min-height:0; overflow:hidden; padding:5px 7px; }
  .cube-scene { position:relative; height:calc(100% - 12px); min-height:72px; display:grid; place-items:center; perspective:260px; overflow:visible; }
  .cube3d { position:relative; width:44px; height:44px; transform-style:preserve-3d; animation:cubeOrbit 7.5s ease-in-out infinite; filter:drop-shadow(0 0 9px rgba(83,247,220,.3)); }
  .cube-face { position:absolute; inset:0; display:grid; place-items:center; border:1px solid #7dffe9; background:linear-gradient(135deg,rgba(117,255,234,.24),rgba(48,107,255,.11)); box-shadow:inset 0 0 13px rgba(97,236,219,.2); backface-visibility:visible; }
  .cube-face::after { content:""; width:48%; height:48%; border:1px solid rgba(201,255,246,.4); transform:rotate(45deg); }
  .cube-front { transform:translateZ(22px); }
  .cube-back { transform:rotateY(180deg) translateZ(22px); background:linear-gradient(135deg,rgba(86,176,255,.22),rgba(68,255,207,.08)); }
  .cube-right { transform:rotateY(90deg) translateZ(22px); }
  .cube-left { transform:rotateY(-90deg) translateZ(22px); }
  .cube-top { transform:rotateX(90deg) translateZ(22px); background:linear-gradient(135deg,rgba(209,255,249,.26),rgba(48,145,255,.14)); }
  .cube-bottom { transform:rotateX(-90deg) translateZ(22px); }
  @keyframes cubeOrbit {
    0% { transform:rotateX(-24deg) rotateY(-20deg) rotateZ(-7deg) translateY(2px); }
    22% { transform:rotateX(25deg) rotateY(65deg) rotateZ(5deg) translateY(-6px); }
    48% { transform:rotateX(38deg) rotateY(175deg) rotateZ(-4deg) translateY(3px); }
    72% { transform:rotateX(-12deg) rotateY(270deg) rotateZ(7deg) translateY(-4px); }
    100% { transform:rotateX(-24deg) rotateY(340deg) rotateZ(-7deg) translateY(2px); }
  }
  .readout-values { display:flex; justify-content:space-between; font-size:8px; gap:6px; padding-top:4px; }
  .readout-values span:first-child { color:#73f2d1; }
  .readout-values span:last-child { color:#b2d5dc; }
  .monitor-foot { font-size:8px; letter-spacing:.19em; color:#8e9690; text-transform:uppercase; }

  /* LOWER CENTER: plasma drawing orb */
  .plasma-zone { grid-column:2; grid-row:2; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; padding-top:2px; }
  .plasma-holder { display:flex; flex-direction:column; align-items:center; gap:0; transform:translateY(8px); }
  .plasma-unit { position:relative; width:min( min(52vw, 560px), 64vh); min-width:300px; aspect-ratio:1; border-radius:50%; touch-action:none; user-select:none; cursor:crosshair; }
  .plasma-rim { position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 25deg,#737b7e,#eff2ed 12%,#9aa1a1 24%,#f3f4ef 37%,#7b8485 51%,#dfe3de 65%,#737c7d 79%,#eef0ec 91%,#737b7e); box-shadow:0 0 0 1px #f9faf6, 0 4px 0 #848c8b, 0 10px 20px rgba(52,57,54,.16); }
  .plasma-rim::after { content:""; position:absolute; inset:7px; border-radius:50%; border:1px solid rgba(255,255,255,.82); }
  .plasma-inner { position:absolute; inset:13px; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 51% 46%, #202a3a 0%, #101822 57%, #090d14 100%); border:2px solid #727b80; box-shadow:inset 0 0 0 2px #202a31, inset 0 0 22px rgba(0,0,0,.9); }
  .plasma-inner::before { content:""; position:absolute; inset:7%; border-radius:50%; border:1px solid rgba(131,179,206,.16); box-shadow:inset 0 0 20px rgba(55,135,183,.08); }
  .plasma-inner::after { content:""; position:absolute; inset:15%; border-radius:50%; border:1px dashed rgba(122,183,212,.13); pointer-events:none; }
  .plasma-ambient { position:absolute; inset:0; width:100%; height:100%; opacity:.85; pointer-events:none; }
  .plasma-glow { position:absolute; left:50%; top:50%; width:37%; height:37%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(73,234,255,.14), rgba(59,87,222,.08) 46%, transparent 71%); filter:blur(4px); pointer-events:none; animation:corepulse 3.4s ease-in-out infinite; }
  @keyframes corepulse { 0%,100% { transform:translate(-50%,-50%) scale(.85); opacity:.55; } 50% { transform:translate(-50%,-50%) scale(1.17); opacity:1; } }
  #plasmaCanvas { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; z-index:3; pointer-events:auto; }
  /* RIGHT: a long-stroke, chunky metal lever that travels vertically */
  .lever-zone { grid-column:3; grid-row:1 / 3; display:flex; flex-direction:column; align-items:center; padding-top:7px; min-width:0; }
  .lever-shell { position:relative; flex:1; width:100%; min-height:590px; max-height:790px; border:2px solid #8d9496; border-radius:19px; background:linear-gradient(90deg,#a4aaac 0%,#c7ccce 18%,#b7bdbe 50%,#d0d4d5 78%,#9da4a6 100%); box-shadow:inset 0 0 0 3px #e2e5e5, inset 0 0 0 7px #929a9d, 0 5px 10px rgba(35,40,42,.12); display:block; margin-top:2px; overflow:hidden; touch-action:none; }
  .lever-shell::before { content:""; position:absolute; left:50%; top:18px; bottom:18px; width:28px; transform:translateX(-50%); border-radius:15px; background:linear-gradient(90deg,#687175,#252b2e 20%,#6f777a 45%,#333a3d 78%,#858d90); border:2px solid #899194; box-shadow:inset 0 0 0 3px #444c4f, 0 0 0 2px rgba(255,255,255,.42); }
  .lever-shell::after { content:""; position:absolute; left:50%; top:50%; width:54px; height:8px; transform:translate(-50%,-50%); border-radius:8px; background:linear-gradient(180deg,#535d61,#e2e6e5 40%,#747d81); box-shadow:0 0 0 4px rgba(190,197,199,.6); pointer-events:none; }
  .lever-stop { position:absolute; left:50%; width:40px; height:40px; transform:translateX(-50%); border-radius:50%; border:3px solid #7a8387; background:radial-gradient(circle at 30% 25%,#e5e9e8,#9fa8ab 66%,#657074); box-shadow:inset 0 0 0 5px #b7bec0, 0 2px 3px rgba(30,34,36,.2); z-index:1; }
  .lever-stop.top { top:20px; }
  .lever-stop.bottom { bottom:20px; }
  .lever-knob { position:absolute; inset:0; width:100%; height:100%; border:0; padding:0; background:transparent; cursor:grab; touch-action:none; z-index:3; }
  .lever-knob:active { cursor:grabbing; }
  .lever-assembly { position:absolute; left:50%; top:0; width:76px; height:150px; transform:translate(-50%, 0); pointer-events:none; will-change:top; z-index:2; }
  .lever-arm { position:absolute; left:50%; top:0; width:24px; height:100%; transform:translateX(-50%); border:2px solid #697276; border-radius:13px; background:linear-gradient(90deg,#5c666a 0%,#e8eceb 20%,#9ca5a8 39%,#f5f6f3 54%,#858e92 79%,#4f595d 100%); box-shadow:0 3px 5px rgba(30,35,37,.25),inset 0 0 0 2px rgba(255,255,255,.42); }
  .lever-arm::before { content:""; position:absolute; left:5px; right:5px; top:7px; bottom:7px; border-radius:7px; background:linear-gradient(90deg,rgba(50,59,62,.54),rgba(255,255,255,.5),rgba(72,81,84,.35)); }
  .lever-head { position:absolute; left:50%; bottom:-5px; width:66px; height:66px; transform:translateX(-50%); border-radius:22px; border:2px solid #657074; background:linear-gradient(135deg,#eef0ee 0%,#bdc5c6 22%,#7f898d 50%,#dfe3e2 74%,#6e787c 100%); box-shadow:inset 0 0 0 3px rgba(255,255,255,.48),inset 0 -5px 8px rgba(35,41,43,.18),0 4px 0 #5d666a,0 8px 11px rgba(35,40,42,.22); pointer-events:none; }
  .lever-head::before { content:""; position:absolute; inset:9px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.64); background:linear-gradient(135deg,rgba(255,255,255,.52),rgba(74,84,88,.15)); }
  .lever-head::after { content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; transform:translate(-50%,-50%); border-radius:50%; border:2px solid #687276; background:#cbd0d0; box-shadow:inset 0 0 0 2px #f3f5f2; }


  .tiny-screw { position:absolute; width:7px; height:7px; border-radius:50%; border:1px solid #87908d; background:#c8ccc6; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6); }
  .tiny-screw::after { content:""; position:absolute; height:1px; width:4px; background:#727a77; left:1px; top:2px; transform:rotate(-35deg); }
  .screw-a { top:9px; left:9px; } .screw-b { top:9px; right:9px; } .screw-c { bottom:9px; left:9px; } .screw-d { bottom:9px; right:9px; }
  .status-strip { position:absolute; bottom:13px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; color:#929790; text-transform:uppercase; white-space:nowrap; font:8px ui-monospace,monospace; letter-spacing:.15em; }
  .status-strip i { width:5px; height:5px; border-radius:50%; background:#52cbb8; box-shadow:0 0 7px rgba(82,203,184,.65); }

  @media (max-width: 1100px) {
    .workbench { height:auto; min-height:100vh; grid-template-columns:310px minmax(300px,1fr) 112px; grid-template-rows:315px minmax(460px,1fr); padding:22px 18px; gap:20px 14px; }
    .safe-dial { width:280px; }
    .color-keys { grid-template-columns:repeat(2, 125px); gap:15px; }
    .key { height:112px; }
    .monitor { height:clamp(260px, 32vh, 300px); }
    .plasma-unit { width:min(48vw, 500px, 58vh); min-width:270px; }
    .lever-shell { min-height:560px; }
  }
  @media (max-width: 720px) {
    .workbench { height:auto; min-height:100vh; grid-template-columns:minmax(0,1fr) 82px; grid-template-rows:auto auto auto; padding:22px 12px 48px; gap:22px 10px; }
    .machine-label { top:8px; font-size:8px; }
    .left-bank { grid-column:1; grid-row:1; flex-direction:column; align-items:center; justify-content:flex-start; gap:17px; padding-top:10px; }
    .safe-dial { width:min(70vw, 285px); flex-shrink:0; }
    .dial-area { gap:8px; width:auto; }
    .keys-area { width:auto; padding-top:0; }
    .color-keys { grid-template-columns:repeat(2, minmax(82px, 112px)); gap:10px; }
    .key { height:92px; }
    .monitor-zone { grid-column:1 / 3; grid-row:2; padding-top:0; }
    .monitor { width:100%; height:230px; }
    .plasma-zone { grid-column:1 / 3; grid-row:3; min-height:370px; }
    .plasma-holder { transform:none; }
    .plasma-unit { width:min(82vw, 470px); min-width:260px; }
    .lever-zone { grid-column:2; grid-row:1 / 4; align-self:stretch; padding-top:22px; }
    .lever-shell { min-height:690px; max-height:900px; }
    .lever-assembly { width:62px; height:130px; }
    .lever-arm { width:20px; }
    .lever-head { width:54px; height:58px; border-radius:18px; }
    .lever-stop { width:32px; height:32px; }
    .screen-topline { font-size:8px; }
    .screen-content { gap:7px; }
    .chart-panel, .cube-panel, .data-panel { padding:4px; }
    .readout-values { font-size:7px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior:auto !important; }
  }


  /* Dedicated phone layout: portrait first, landscape when the phone is rotated. */
  @media (max-width: 720px) {
    html, body { min-height: 100%; width: 100%; overflow-x: hidden; }
    body { overscroll-behavior-x: none; }
    .workbench {
      display: grid;
      width: 100%; height: auto; min-height: 100vh; min-height: 100svh;
      grid-template-columns: minmax(0, 1fr) 60px;
      grid-template-rows: auto auto auto;
      gap: 15px 9px;
      padding: 34px 10px 18px;
      margin: 0 auto;
    }
    .workbench::before { inset: 7px; border-radius: 15px; }
    .machine-label { top: 10px; font-size: 8px; letter-spacing: .2em; }

    .monitor-zone { grid-column: 1 / 3; grid-row: 1; width: 100%; min-width: 0; padding: 0; gap: 0; }
    .monitor { width: 100%; height: clamp(175px, 52vw, 220px); min-height: 0; border-width: 4px; padding: 4px; border-radius: 10px; }
    .monitor-screen { padding: 9px 9px; }
    .screen-topline { font-size: 7px; letter-spacing: .06em; gap: 5px; }
    .screen-live { gap: 4px; white-space: nowrap; }
    .screen-content { grid-template-columns: 1.15fr .78fr; gap: 6px; height: calc(100% - 21px); padding-top: 7px; }
    .chart-panel, .cube-panel, .data-panel { padding: 4px; }
    .tiny-label { font-size: 5.5px; letter-spacing: .04em; }
    .right-readouts { gap: 5px; }
    .cube-scene { min-height: 42px; }
    .cube3d { width: 28px; height: 28px; }
    .cube-front { transform: translateZ(14px); }
    .cube-back { transform: rotateY(180deg) translateZ(14px); }
    .cube-right { transform: rotateY(90deg) translateZ(14px); }
    .cube-left { transform: rotateY(-90deg) translateZ(14px); }
    .cube-top { transform: rotateX(90deg) translateZ(14px); }
    .cube-bottom { transform: rotateX(-90deg) translateZ(14px); }
    .readout-values { font-size: 6px; gap: 3px; padding-top: 3px; }

    .left-bank {
      grid-column: 1; grid-row: 2;
      min-width: 0; width: 100%; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      gap: 15px;
    }
    .dial-area { width: 100%; gap: 0; }
    .safe-dial { width: min(64vw, 228px); min-width: 0; flex-shrink: 0; border-width: 7px; }
    .dial-face { inset: 8px; }
    .dial-number { font-size: 7px; width: 20px; height: 12px; margin-left: -10px; margin-top: -6px; }
    .dial-number.major { font-size: 6px; }
    .dial-pointer { width: 3px; }
    .dial-status, .dial-instructions, .dial-heading, .keys-heading, .screen-heading, .lever-heading,
    .key-label, .monitor-foot, .status-strip { display: none !important; }
    .keys-area { width: 100%; padding: 0; gap: 0; }
    .color-keys {
      width: min(100%, 250px); margin: 0 auto;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .key { width: 100%; height: clamp(68px, 18vw, 82px); min-width: 0; border-radius: 14px; }
    .key-cap { border-radius: 13px; }
    .key-cap::after { inset: 6px; border-radius: 8px; }

    .lever-zone {
      grid-column: 2; grid-row: 2;
      align-self: stretch; min-width: 0; width: 100%; padding: 0; display: flex;
    }
    .lever-shell {
      width: 100%; height: 100%; min-height: 0; max-height: none;
      min-height: 100%; margin: 0; border-radius: 15px;
    }
    .lever-shell::before { top: 14px; bottom: 14px; width: 21px; }
    .lever-shell::after { width: 44px; height: 7px; }
    .lever-stop { width: 27px; height: 27px; border-width: 2px; }
    .lever-stop.top { top: 15px; }
    .lever-stop.bottom { bottom: 15px; }
    .lever-assembly { width: 50px; height: 95px; }
    .lever-arm { width: 17px; border-radius: 10px; }
    .lever-head { width: 43px; height: 47px; border-radius: 15px; bottom: -4px; }
    .lever-head::before { inset: 7px 8px; border-radius: 10px; }

    .plasma-zone { grid-column: 1 / 3; grid-row: 3; min-height: 0; padding: 0; }
    .plasma-holder { transform: none; width: 100%; }
    .plasma-unit { width: min(86vw, 350px); min-width: 0; max-width: 100%; }
    #plasmaCanvas { touch-action: none; }
  }

  @media (max-width: 900px) and (orientation: landscape) {
    .workbench {
      display: grid; width: 100%; height: auto; min-height: 100vh; min-height: 100svh;
      grid-template-columns: minmax(165px, .72fr) minmax(230px, 1.35fr) 60px;
      grid-template-rows: minmax(125px, 36vh) minmax(200px, 1fr);
      gap: 10px; padding: 25px 10px 10px;
    }
    .workbench::before { inset: 6px; border-radius: 12px; }
    .machine-label { top: 8px; font-size: 7px; }
    .monitor-zone { grid-column: 2; grid-row: 1; padding: 0; min-width: 0; }
    .monitor { height: 100%; min-height: 125px; width: 100%; border-width: 3px; padding: 3px; }

    .readout-values { font-size: 5px; padding-top: 2px; }
    .left-bank { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; min-width: 0; }
    .dial-area { width: 100%; gap: 0; }

    .dial-status, .dial-instructions, .dial-heading, .keys-heading, .screen-heading, .lever-heading,

    .keys-area { width: 100%; padding: 0; }

    .key { height: clamp(42px, 12vh, 60px); border-radius: 8px; }
    .key-cap { border-radius: 8px; }
    .key-cap::after { inset: 4px; border-radius: 5px; }
    .plasma-zone { grid-column: 2; grid-row: 2; min-height: 0; padding: 0; }
    .plasma-holder { transform: none; }
    .plasma-unit { width: min(42vw, 54vh, 300px); min-width: 0; }

    .lever-arm { width: 16px; }
    .lever-head { width: 40px; height: 43px; border-radius: 13px; }
    .lever-stop { width: 25px; height: 25px; }
  }

<script>
(() => {
  // --- Safe dial: decorative tapered ribbon, mouse activation on desktop, direct drag on touch ---
  const dial = document.getElementById('safeDial');
  const dialNumbers = document.getElementById('dialNumbers');
  let dialActive = false;
  let dialRotation = 0;
  let lastMouseAngle = null;
  const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
  let touchDialDragging = false;

  // Build a tapered ribbon that circles the outer edge of the dial.
  // It makes one near-closed loop: the thick end overlaps the thin beginning.
  const svgNS = 'http://www.w3.org/2000/svg';
  const ribbonSvg = document.createElementNS(svgNS, 'svg');
  ribbonSvg.setAttribute('viewBox', '0 0 200 200');
  ribbonSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  ribbonSvg.setAttribute('aria-hidden', 'true');
  ribbonSvg.classList.add('dial-ribbon-svg');
  const ribbonDefs = document.createElementNS(svgNS, 'defs');
  const ribbonGradient = document.createElementNS(svgNS, 'linearGradient');
  ribbonGradient.setAttribute('id', 'dialRibbonMetal');
  ribbonGradient.setAttribute('x1', '0%'); ribbonGradient.setAttribute('y1', '0%');
  ribbonGradient.setAttribute('x2', '100%'); ribbonGradient.setAttribute('y2', '100%');
  [
    ['0%', '#596367'], ['18%', '#e6ece9'], ['36%', '#aab5b4'],
    ['52%', '#4fc9bd'], ['70%', '#dce6e3'], ['88%', '#7a8588'], ['100%', '#394448']
  ].forEach(([offset, color]) => {
    const stop = document.createElementNS(svgNS, 'stop');
    stop.setAttribute('offset', offset); stop.setAttribute('stop-color', color);
    ribbonGradient.appendChild(stop);
  });
  ribbonDefs.appendChild(ribbonGradient); ribbonSvg.appendChild(ribbonDefs);

  const ribbonPoints = [];
  const ribbonSteps = 360;
  const ribbonTurns = Math.PI * 2;
  for (let i = 0; i <= ribbonSteps; i++) {
    const t = ribbonTurns * i / ribbonSteps;
    const progress = t / ribbonTurns;
    const r = 84 - 2 * progress;
    const width = 2 + 16 * progress;
    const angle = -Math.PI / 2 + t;
    const dr = -2 / ribbonTurns;
    const x = 100 + r * Math.cos(angle);
    const y = 100 + r * Math.sin(angle);
    const dx = dr * Math.cos(angle) - r * Math.sin(angle);
    const dy = dr * Math.sin(angle) + r * Math.cos(angle);
    const length = Math.hypot(dx, dy) || 1;
    const nx = -dy / length, ny = dx / length;
    ribbonPoints.push({x, y, nx, ny, width});
  }
  const ribbonEdgeA = ribbonPoints.map(p => `${p.x + p.nx*p.width/2},${p.y + p.ny*p.width/2}`);
  const ribbonEdgeB = ribbonPoints.slice().reverse().map(p => `${p.x - p.nx*p.width/2},${p.y - p.ny*p.width/2}`);
  const ribbonPath = document.createElementNS(svgNS, 'path');
  ribbonPath.setAttribute('d', `M ${ribbonEdgeA.join(' L ')} L ${ribbonEdgeB.join(' L ')} Z`);
  ribbonPath.setAttribute('fill', 'url(#dialRibbonMetal)');
  ribbonPath.setAttribute('stroke', 'rgba(236,246,243,.38)');
  ribbonPath.setAttribute('stroke-width', '.6');
  ribbonSvg.appendChild(ribbonPath);
  const ribbonHighlight = document.createElementNS(svgNS, 'path');
  ribbonHighlight.setAttribute('d', `M ${ribbonPoints.map(p => `${p.x - p.nx*p.width*.16},${p.y - p.ny*p.width*.16}`).join(' L ')}`);
  ribbonHighlight.setAttribute('fill', 'none');
  ribbonHighlight.setAttribute('stroke', 'rgba(255,255,255,.58)');
  ribbonHighlight.setAttribute('stroke-width', '.8');
  ribbonHighlight.setAttribute('stroke-linecap', 'round');
  ribbonHighlight.setAttribute('opacity', '.72');
  ribbonSvg.appendChild(ribbonHighlight);
  dialNumbers.appendChild(ribbonSvg);

  // Number labels intentionally omitted: the decorative loop is the dial's only pattern.
  function angleFromEvent(event) {
    const r = dial.getBoundingClientRect();
    return Math.atan2(event.clientY - (r.top + r.height / 2), event.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  }
  function setDialState(active) {
    dialActive = active;
    dial.classList.toggle('is-active', active);
    dial.setAttribute('aria-pressed', String(active));
    if (!active) lastMouseAngle = null;
  }
  function rotateDialFromEvent(event) {
    const current = angleFromEvent(event);
    if (lastMouseAngle !== null) {
      let delta = current - lastMouseAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      dialRotation += delta;
      dialNumbers.style.transform = `rotate(${dialRotation}deg)`;
    }
    lastMouseAngle = current;
  }
  if (coarsePointer) {
    // On phones, touch-and-drag rotates directly instead of needing a mouse-style toggle.
    dial.addEventListener('pointerdown', (event) => {
      if (event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
      touchDialDragging = true;
      setDialState(true);
      lastMouseAngle = angleFromEvent(event);
      try { dial.setPointerCapture(event.pointerId); } catch (_) {}
      event.preventDefault();
    });
    dial.addEventListener('pointermove', (event) => {
      if (touchDialDragging) rotateDialFromEvent(event);
    });
    const endTouchDial = () => {
      if (!touchDialDragging) return;
      touchDialDragging = false;
      setDialState(false);
    };
    dial.addEventListener('pointerup', endTouchDial);
    dial.addEventListener('pointercancel', endTouchDial);
    dial.addEventListener('lostpointercapture', endTouchDial);
  } else {
    dial.addEventListener('click', (event) => {
      event.stopPropagation();
      if (dialActive) setDialState(false);
      else { setDialState(true); lastMouseAngle = angleFromEvent(event); }
    });
    dial.addEventListener('pointerleave', () => { if (dialActive) setDialState(false); });
    dial.addEventListener('mouseleave', () => { if (dialActive) setDialState(false); });
    document.addEventListener('click', (event) => {
      if (dialActive && !dial.contains(event.target)) setDialState(false);
    });
    document.addEventListener('mousemove', (event) => {
      if (dialActive) rotateDialFromEvent(event);
    });
  }
  dial.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      setDialState(!dialActive);
    }
  });

  // --- Momentary colored buttons -----------------------------------------
  document.querySelectorAll('.key').forEach((key) => {
    let resetTimer;
    const press = () => {
      window.clearTimeout(resetTimer);
      key.classList.add('is-pressed');
      resetTimer = window.setTimeout(() => key.classList.remove('is-pressed'), 190);
    };
    key.addEventListener('pointerdown', press);
    key.addEventListener('pointerup', () => { resetTimer = window.setTimeout(() => key.classList.remove('is-pressed'), 125); });
    key.addEventListener('pointerleave', () => { resetTimer = window.setTimeout(() => key.classList.remove('is-pressed'), 125); });
    key.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') press(); });
  });

  // --- Tiny changing monitor readouts -------------------------------------
  const coreValue = document.getElementById('coreValue');
  const voltValue = document.getElementById('voltValue');
  window.setInterval(() => {
    coreValue.textContent = (97.8 + Math.random() * 1.9).toFixed(2) + '%';
    voltValue.textContent = (11.85 + Math.random() * .48).toFixed(2) + ' kV';
  }, 1450);

  // --- Long mechanical lever: pull vertically along the full panel -------------
  const leverShell = document.getElementById('leverShell');
  const leverKnob = document.getElementById('leverKnob');
  const leverAssembly = document.getElementById('leverAssembly');
  let leverPosition = 0; // 0 = top, 1 = bottom
  let leverDragging = false;
  let leverMoved = false;
  let leverDownY = 0;
  let leverStartPosition = 0;
  let leverTopLimit = 16;
  let leverBottomLimit = 0;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function updateLeverLimits() {
    const shell = leverShell.getBoundingClientRect();
    const assemblyHeight = leverAssembly.getBoundingClientRect().height || 150;
    leverTopLimit = 12;
    leverBottomLimit = Math.max(leverTopLimit, shell.height - assemblyHeight - 12);
  }
  function drawLever() {
    updateLeverLimits();
    leverAssembly.style.top = `${leverTopLimit + leverPosition * (leverBottomLimit - leverTopLimit)}px`;
    leverKnob.setAttribute('aria-pressed', String(leverPosition >= .5));
  }
  leverKnob.addEventListener('pointerdown', (e) => {
    const handleRect = leverAssembly.getBoundingClientRect();
    if (e.clientX < handleRect.left - 3 || e.clientX > handleRect.right + 3 || e.clientY < handleRect.top || e.clientY > handleRect.bottom) return;
    leverDragging = true;
    leverMoved = false;
    leverDownY = e.clientY;
    leverStartPosition = leverPosition;
    try { leverKnob.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  leverKnob.addEventListener('pointermove', (e) => {
    if (!leverDragging) return;
    const delta = e.clientY - leverDownY;
    if (Math.abs(delta) > 5) leverMoved = true;
    if (leverMoved) {
      updateLeverLimits();
      const range = Math.max(1, leverBottomLimit - leverTopLimit);
      leverPosition = clamp(leverStartPosition + delta / range, 0, 1);
      drawLever();
    }
  });
  function endLeverDrag() {
    if (!leverDragging) return;
    leverDragging = false;
    if (leverMoved) leverPosition = leverPosition >= .5 ? 1 : 0;
    else leverPosition = leverPosition >= .5 ? 0 : 1;
    drawLever();
  }
  leverKnob.addEventListener('pointerup', endLeverDrag);
  leverKnob.addEventListener('pointercancel', endLeverDrag);
  leverKnob.addEventListener('lostpointercapture', () => { if (leverDragging) endLeverDrag(); });
  leverKnob.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); leverPosition = leverPosition >= .5 ? 0 : 1; drawLever(); }
    if (e.key === 'ArrowUp') { leverPosition = 0; drawLever(); }
    if (e.key === 'ArrowDown') { leverPosition = 1; drawLever(); }
  });
  window.addEventListener('resize', drawLever);
  drawLever();

  // --- Plasma surface: draw while held, then fade from tail to head --------
  const plasmaUnit = document.getElementById('plasmaUnit');
  const canvas = document.getElementById('plasmaCanvas');
  const ctx = canvas.getContext('2d');
  let pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let drawing = false;
  let activeTrail = null;
  const trails = [];
  function resizeCanvas() {
    const box = canvas.getBoundingClientRect();
    if (!box.width || !box.height) return;
    pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.round(box.width * pixelRatio);
    canvas.height = Math.round(box.height * pixelRatio);
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  }
  function getCanvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width, h: rect.height };
  }
  function withinCircle(p) {
    const cx = p.w / 2, cy = p.h / 2, r = Math.min(p.w, p.h) * .475;
    return (p.x - cx) ** 2 + (p.y - cy) ** 2 <= r ** 2;
  }
  function trailLength(points) {
    let total = 0;
    for (let i = 1; i < points.length; i++) total += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    return total;
  }
  function trimTrail(trail) {
    // Keep a short, snake-like trail. Old points are continuously removed while drawing.
    let total = trailLength(trail.points);
    while (trail.points.length > 2 && total > trail.maxLength) {
      const a = trail.points[0], b = trail.points[1];
      total -= Math.hypot(b.x - a.x, b.y - a.y);
      trail.points.shift();
    }
    trail.currentLength = total;
  }
  function addPoint(trail, p) {
    const last = trail.points[trail.points.length - 1];
    if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 1.7) {
      trail.points.push({ x: p.x, y: p.y, seed: Math.random(), t: performance.now() });
      trimTrail(trail);
    }
  }
  canvas.addEventListener('pointerdown', (e) => {
    const p = getCanvasPoint(e);
    if (!withinCircle(p)) return;
    e.preventDefault();
    drawing = true;
    activeTrail = { points: [], created: performance.now(), releasedAt: null, hue: 176 + Math.random() * 54, width: 1.5 + Math.random() * 1.1, maxLength: Math.min(p.w * .55, 220), currentLength: 0 };
    addPoint(activeTrail, p);
    trails.push(activeTrail);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing || !activeTrail) return;
    addPoint(activeTrail, getCanvasPoint(e));
  });
  function stopDrawing() {
    if (!drawing || !activeTrail) return;
    drawing = false;
    activeTrail.releasedAt = performance.now();
    activeTrail = null;
  }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
  canvas.addEventListener('lostpointercapture', stopDrawing);
  window.addEventListener('resize', resizeCanvas);
  if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(plasmaUnit);
  resizeCanvas();
  function drawElectricSegment(a, b, alpha, hue, width) {
    if (alpha <= .015) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const steps = Math.max(2, Math.ceil(len / 8));
    const nx = len ? -dy / len : 0, ny = len ? dx / len : 0;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowBlur = 10; ctx.shadowColor = `hsl(${hue} 100% 65%)`;
    ctx.strokeStyle = `hsl(${hue} 100% 64%)`; ctx.lineWidth = width * 2.8;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    for (let s = 1; s < steps; s++) {
      const t = s / steps;
      const jitter = Math.sin(t * Math.PI * 7 + (a.seed || 0) * 10) * (1.6 + width) + (Math.random() - .5) * 1.7;
      ctx.lineTo(a.x + dx * t + nx * jitter, a.y + dy * t + ny * jitter);
    }
    ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(231,255,255,.95)'; ctx.lineWidth = Math.max(.6, width * .55);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // Small forked sparks keep the trace looking electric without making it 3D.
    if (len > 10 && (a.seed || 0) > .55) {
      const t = .35 + ((a.seed || 0) * .3);
      const bx = a.x + dx * t, by = a.y + dy * t;
      const side = (a.seed || 0) > .77 ? 1 : -1;
      ctx.strokeStyle = `hsla(${hue + 22},100%,75%,${alpha * .85})`; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + nx * side * (4 + 9 * (a.seed || 0)) + dx * .12, by + ny * side * (4 + 9 * (a.seed || 0)) + dy * .12); ctx.stroke();
    }
    ctx.restore();
  }
  function animatePlasma(now) {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.save();
      ctx.beginPath(); ctx.arc(rect.width / 2, rect.height / 2, Math.min(rect.width, rect.height) * .475, 0, Math.PI * 2); ctx.clip();
      for (let i = trails.length - 1; i >= 0; i--) {
        const tr = trails[i];
        if (tr.releasedAt !== null && now - tr.releasedAt > 1150) { trails.splice(i, 1); continue; }
        const pts = tr.points;
        // Measure cumulative distance so the tail is already fading during a drag.
        const cumulative = [0];
        for (let k = 1; k < pts.length; k++) cumulative[k] = cumulative[k - 1] + Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
        const totalDistance = cumulative[cumulative.length - 1] || 1;
        if (pts.length === 1) {
          const elapsed = tr.releasedAt === null ? 0 : now - tr.releasedAt;
          const activeAgeFade = tr.releasedAt === null ? clamp(1 - (now - (pts[0].t || tr.created)) / 900, 0, 1) : 1;
          const alpha = tr.releasedAt === null ? activeAgeFade : Math.max(0, 1 - elapsed / 1000);
          ctx.save(); ctx.globalAlpha = alpha; ctx.shadowBlur = 12; ctx.shadowColor = '#7af7ff'; ctx.fillStyle = '#e1ffff'; ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 2.8, 0, Math.PI*2); ctx.fill(); ctx.restore();
        }
        const elapsed = tr.releasedAt === null ? 0 : now - tr.releasedAt;
        const fade = Math.min(1, elapsed / 1000);
        for (let j = 1; j < pts.length; j++) {
          // The tail is dim while the head stays bright, including during a continuous drag.
          const distAtSegment = cumulative[j - 1];
          const tailAlpha = clamp(distAtSegment / Math.min(42, totalDistance), 0, 1);
          const tailToHead = cumulative[j - 1] / totalDistance;
          let alpha = tailAlpha;
          if (tr.releasedAt === null) {
            // Segment age causes the trail to evaporate continuously while the mouse is still held.
            alpha *= clamp(1 - (now - (pts[j].t || tr.created)) / 900, 0, 1);
          } else {
            const releaseFade = 1 - clamp((fade - tailToHead * .65) / .35, 0, 1);
            alpha *= releaseFade;
          }
          drawElectricSegment(pts[j-1], pts[j], alpha, tr.hue, tr.width);
        }
      }
      ctx.restore();
    }
    requestAnimationFrame(animatePlasma);
  }
  requestAnimationFrame(animatePlasma);
})();
</script>
